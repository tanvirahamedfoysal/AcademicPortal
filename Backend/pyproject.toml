[project]
name = "academic-portal-backend"
version = "0.1.0"
description = "FastAPI backend for managing API for Academic Portal project."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "asyncpg>=0.31.0",
    "cloudinary>=1.44.4",
    "fastapi-cloud-cli>=0.21.0",
    "fastapi-mail>=1.6.5",
    "fastapi[standard]>=0.138.2",
    "greenlet>=3.5.3",
    "passlib[argon2]>=1.7.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.49.0",
]


[tool.fastapi]
entrypoint = "app.main:app"


[tool.pytest.ini_options]
asyncio_mode = "auto"
